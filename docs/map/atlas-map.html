<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas 实现地图 · 交互全景</title>
<style>
  :root{
    --background:#eef1f6; --foreground:#16181d; --card:#fdfdfe; --card-foreground:#16181d;
    --border:#d8dde6; --muted-foreground:#5f6772; --popover:#fdfdfe; --popover-foreground:#16181d;
    --grid:rgba(22,24,29,.05); --zone:rgba(22,24,29,.42);
    --primary:#4f46e5;
    --blue:#2563eb; --green:#059669; --yellow:#d97706; --red:#e11d48; --orange:#7c3aed; --purple:#7c3aed; --slate:#475569;
    --shadow:0 10px 30px rgba(20,26,40,.10); --card-shadow:0 1px 2px rgba(20,26,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--foreground);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  .page{width:100%;max-width:min(96vw,1680px);margin:0 auto;padding:0 18px;display:flex;flex-direction:column}
  .page+.page{flex:1}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0 9px;
    border-bottom:1px solid var(--border);margin-bottom:12px}
  .brand{font-weight:700;font-size:17px;letter-spacing:.3px;color:var(--foreground);display:flex;align-items:center;gap:12px}
  .brand .logo{width:9px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--blue))}
  .brand .bt{display:flex;flex-direction:column}
  .brand small{font-weight:400;font-size:10.5px;color:var(--muted-foreground);letter-spacing:0;margin-top:1px}
  .actions{display:flex;gap:8px;margin-left:auto}
  .actions button{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);
    border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:var(--card-shadow)}
  .actions button:not(:disabled):hover{color:var(--primary);border-color:var(--primary)}
  .actions button:disabled{cursor:default;opacity:.6}
  .actions button.primarylike{background:var(--primary);border-color:var(--primary);color:var(--card)}
  .crumb{display:flex;align-items:center;gap:8px;padding:0 0 7px;font-size:13px;color:var(--muted-foreground)}
  .crumb a{color:var(--muted-foreground);cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--primary);text-decoration:underline}
  .crumb .cur{color:var(--foreground);font-weight:600}
  #canvas{border:1px solid var(--border);border-radius:16px;background-color:var(--card);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;background-position:center;overflow:hidden;box-shadow:var(--shadow)}
  #canvas.svgmode{padding:8px;width:fit-content;max-width:100%;margin:0 auto}
  #canvas.detailmode{padding:30px 34px;width:100%}
  #canvas svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 2px 0;font-size:12px;color:var(--muted-foreground);align-items:center}
  .legend .li{display:inline-flex;align-items:center;gap:5px}
  .legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  footer{padding:5px 2px 10px;font-size:11.5px;color:var(--muted-foreground);display:flex;gap:14px;flex-wrap:wrap}
  /* ---- SVG 图内元素 ---- */
  .zone rect{fill:color-mix(in srgb,var(--blue) 4%,transparent);stroke:var(--zone);stroke-dasharray:6 4;stroke-width:1.3;rx:12}
  .zone text{fill:var(--muted-foreground);font-size:11.5px;font-weight:600;letter-spacing:1.5px}
  .edge{fill:none;stroke:var(--muted-foreground);stroke-width:1.7;opacity:.8}
  .edge.dash{stroke-dasharray:4 5;stroke-width:1.2;opacity:.45}
  .edgehit{fill:none;stroke:rgba(0,0,0,0);stroke-width:14;pointer-events:stroke}
  .edgechip.hastip{cursor:help}
  .edgeLabel{fill:var(--muted-foreground);font-size:12px;font-weight:500;
    paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
  .node{cursor:pointer}
  .node rect.box{fill:var(--card);stroke:var(--nc);stroke-width:1.4;rx:11;
    filter:drop-shadow(0 1px 2px rgba(10,14,20,.06));transition:filter .16s,stroke-width .16s}
  .node:hover rect.box{stroke-width:2.1;filter:drop-shadow(0 7px 18px rgba(10,14,20,.15))}
  .node.external rect.box{stroke:var(--muted-foreground);stroke-dasharray:5 4;fill:var(--card)}
  .node text.t{fill:var(--card-foreground);font-size:12px;font-weight:600}
  .node text.s{fill:var(--muted-foreground);font-size:10px}
  /* ---- 详情页 ---- */
  .detail{max-width:860px;margin:0 auto}
  .detail h2{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detail .badge{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;
    border:1px solid var(--nc);color:var(--nc);white-space:nowrap;background:color-mix(in srgb,var(--nc) 7%,transparent)}
  .detail .sum{color:var(--foreground);font-size:14.5px;line-height:1.65;margin:8px 0 0}
  .detail h3{margin:24px 0 8px;font-size:12px;color:var(--muted-foreground);font-weight:600;
    letter-spacing:1.5px;border-bottom:1px solid var(--border);padding-bottom:7px}
  .detail ul.points{margin:0;padding:0;list-style:none}
  .detail ul.points li{position:relative;padding:5px 0 5px 22px;font-size:14px;line-height:1.6}
  .detail ul.points li::before{content:'';position:absolute;left:3px;top:13px;width:8px;height:8px;
    border-radius:2.5px;background:var(--nc);opacity:.85}
  .detail .files{display:flex;flex-direction:column;gap:2px;margin:0}
  .frow{display:flex;flex-direction:column;gap:1px;padding:5px 0}
  .frow code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;color:var(--primary);word-break:break-all}
  .frow a{color:inherit;text-decoration:none}
  .frow a:hover code,.frow a:focus code{text-decoration:underline}
  .frow .fdesc{font-size:12.5px;color:var(--muted-foreground);line-height:1.45}
  .detail .blind{background:color-mix(in srgb,var(--nc) 7%,transparent);border:1px dashed var(--nc);
    border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6;color:var(--foreground)}
  .detail .doclink{display:inline-block;margin-top:2px;font-family:ui-monospace,Menlo,monospace;
    font-size:12.5px;color:var(--primary);text-decoration:none;cursor:pointer}
  .detail .doclink:hover{text-decoration:underline}
  .detail .submap{margin-top:6px}
  .detail .pinned{margin:0 0 10px;border:1px solid var(--border);border-radius:10px;background:var(--popover);
    padding:10px 14px;font-size:13px;line-height:1.55;display:none;box-shadow:var(--card-shadow)}
  .detail .pinned h5{margin:0 0 3px;font-size:13.5px}
  .detail .pinned p{margin:2px 0}
  /* ---- tooltip ---- */
  #tip{position:fixed;z-index:50;max-width:340px;background:var(--popover);color:var(--popover-foreground);
    border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(10,14,20,.18);
    padding:13px 15px;font-size:13px;line-height:1.55;pointer-events:none;display:none}
  #tip h4{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}
  #tip .badge{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:99px;
    border:1px solid var(--nc);color:var(--nc);white-space:nowrap;background:color-mix(in srgb,var(--nc) 8%,transparent)}
  #tip p{margin:6px 0 8px}
  #tip .files{display:flex;flex-direction:column;gap:2px;margin:0 0 6px}
  #tip .files code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--primary);word-break:break-all}
  #tip .frow{padding:1px 0}
  #tip .frow .fdesc{font-size:11px}
  /* ---- 讲述模式:非焦点降透明,焦点边加粗;底部字幕条 ---- */
  #canvas>svg .node.dim{opacity:.18;pointer-events:none}
  #canvas>svg .edge.dim{opacity:.1}
  #canvas>svg .edge.hi{stroke-width:2.6}
  #tourbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:none;
    background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(10,14,20,.16);
    padding:10px 12px 10px 16px;width:min(92vw,760px);align-items:center;gap:14px}
  #tourbar .step{font-size:11px;color:var(--muted-foreground);white-space:nowrap;font-weight:700}
  #tourbar .tt{font-size:13.5px;line-height:1.5;flex:1}
  #tourbar .tbtns{display:flex;gap:6px;border-left:1px solid var(--border);padding-left:12px}
  #tourbar button{font:inherit;font-size:13px;line-height:1;padding:6px 9px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border);background:var(--card);color:var(--foreground)}
  #tourbar button:hover{border-color:var(--primary);color:var(--primary)}
  /* ---- 讲述沉浸化:页头操作/图例/页脚淡化,hover 恢复(借 archify Presentation Stage) ---- */
  body.touring .actions,body.touring .legend,body.touring footer{opacity:.18;transition:opacity .3s}
  body.touring .actions:hover,body.touring .legend:hover{opacity:1}
  /* ---- 搜索命中子图节点的 pulse 高亮 ---- */
  .node.pulse rect.box{stroke-width:2.4;animation:pulseBox 1.6s ease-out 2}
  @keyframes pulseBox{0%{filter:drop-shadow(0 0 0 rgba(79,70,229,0))}
    35%{filter:drop-shadow(0 0 11px rgba(79,70,229,.55))}100%{filter:drop-shadow(0 0 0 rgba(79,70,229,0))}}
  @media (prefers-reduced-motion:reduce){.node.pulse rect.box{animation:none}}
  /* ---- 节点搜索(借 archify Node Finder) ---- */
  kbd{font-family:ui-monospace,Menlo,monospace;font-size:10px;border:1px solid var(--border);border-radius:4px;
    padding:0 5px;background:var(--card);color:var(--muted-foreground)}
  #finder,#helpbox{position:fixed;inset:0;z-index:70;display:none;background:rgba(22,24,29,.28)}
  #finder.open,#helpbox.open{display:flex}
  #finder{align-items:flex-start;justify-content:center;padding-top:12vh}
  #finder .panel{width:min(92vw,560px);background:var(--popover);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 24px 64px rgba(10,14,20,.28);overflow:hidden;display:flex;flex-direction:column}
  #finder input{appearance:none;border:0;outline:0;background:transparent;color:var(--foreground);
    font:inherit;font-size:15px;padding:14px 16px;border-bottom:1px solid var(--border)}
  #finder input::placeholder{color:var(--muted-foreground)}
  #finder .list{max-height:46vh;overflow:auto;padding:6px}
  #finder .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
  #finder .item.active{background:color-mix(in srgb,var(--primary) 9%,transparent)}
  #finder .item .dot{width:9px;height:9px;border-radius:3px;flex:none}
  #finder .item em{font-style:normal;color:var(--muted-foreground);font-size:12px;margin-left:6px}
  #finder .item .where{margin-left:auto;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
  #finder .empty{padding:18px 16px;font-size:13px;color:var(--muted-foreground);text-align:center}
  #finder .foot{border-top:1px solid var(--border);padding:7px 14px;font-size:11px;color:var(--muted-foreground);display:flex;gap:14px}
  /* ---- 操作小抄(借 archify Diagram Guide,只手动唤出) ---- */
  #helpbox{align-items:center;justify-content:center}
  #helpbox .panel{width:min(92vw,440px);background:var(--popover);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 24px 64px rgba(10,14,20,.28);padding:16px 18px}
  #helpbox h4{margin:0 0 10px;font-size:14px}
  #helpbox .row{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:13px}
  #helpbox .row .k{flex:none;font-weight:600}
  #helpbox .row .d{color:var(--muted-foreground)}
  #helpbox .row .kbtns{margin-left:auto;white-space:nowrap;display:flex;gap:4px}
</style>
</head>
<body>
<div class="page"><header>
  <div class="brand"><span class="logo"></span><span class="bt">Atlas 实现地图<small>锚定 v0.4.0-beta.11 · 图是导航面,细节以 docs/map/ 与代码为准</small></span></div>
  <div class="actions">
    <button id="finderBtn" title="搜索节点(⌘K / Ctrl+K)">⌘K 搜索</button>
    <button id="tourBtn" title="十一步主数据流动线:←/→/空格步进,Esc 退出,可点高亮节点下钻">▶ 讲述模式</button>
    <button id="helpBtn" title="操作小抄(?)">?</button>
  </div>
</header>
<div class="crumb" id="crumb"></div></div>
<div class="page"><div id="canvas"></div><div class="legend" id="legend"></div></div>
<div id="fitbadge" style="position:fixed;right:10px;bottom:8px;font-size:10px;color:var(--muted-foreground);opacity:.55;z-index:40;pointer-events:none"></div>

<div id="tip"></div>

<div id="finder"><div class="panel">
  <input id="finput" placeholder="搜节点:名称 / 说明 / 子系统…(Esc 关闭)" autocomplete="off" spellcheck="false">
  <div class="list" id="flist"></div>
  <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↩</kbd> 打开</span><span><kbd>esc</kbd> 关闭</span></div>
</div></div>

<div id="helpbox"><div class="panel">
  <h4>操作小抄</h4>
  <div class="row"><span class="k">点节点</span><span class="d">打开该子系统的设计详情页</span><span class="kbtns"></span></div>
  <div class="row"><span class="k">悬停节点</span><span class="d">摘要与关键文件</span><span class="kbtns"></span></div>
  <div class="row"><span class="k">搜索节点</span><span class="d">按名称/说明过滤,回车直达</span><span class="kbtns"><kbd>⌘K</kbd><kbd>Ctrl K</kbd></span></div>
  <div class="row"><span class="k">讲述步进</span><span class="d">讲述模式中上下步,空格同 →</span><span class="kbtns"><kbd>←</kbd><kbd>→</kbd><kbd>空格</kbd></span></div>
  <div class="row"><span class="k">返回 / 退出</span><span class="d">依次关面板 → 退讲述 → 详情回全景</span><span class="kbtns"><kbd>esc</kbd></span></div>
  <div class="row"><span class="k">本小抄</span><span class="d">只手动唤出,不自动弹</span><span class="kbtns"><kbd>?</kbd></span></div>
</div></div>

<div id="tourbar">
  <span class="step" id="tstep"></span>
  <span class="tt" id="ttext"></span>
  <span class="tbtns">
    <button id="tprev" title="上一步(←)">⏮</button><button id="tplay" title="自动播放 5s/步">▶</button><button id="tnext" title="下一步(→/空格)">⏭</button><button id="texit" title="退出(Esc)">✕</button>
  </span>
</div>

<script>
/* ================= 类型 ================= */
const KIND = {
  asset:   {c:'--blue',   label:'资产 / 契约'},
  orch:    {c:'--green',  label:'编排'},
  tool:    {c:'--yellow', label:'工具 / 生成'},
  gate:    {c:'--red',    label:'门禁 / 校验'},
  proc:    {c:'--orange', label:'流程 / 评审'},
  support: {c:'--purple', label:'支撑'},
  external:{c:'--muted-foreground', label:'外部 / 输入', external:true},
};

/* ================= 拓扑图数据(与 docs/map/ 同源,发版时随活文档刷新) ================= */
const VIEWS = {
overview: {
  title:'Atlas 全景 · 12 子系统与主数据流', vb:[-4,36,1024,414], zoneLabIn:true,
  zones:[
    {x:12,y:52,w:222,h:262,label:'输入 · 实然'},
    {x:262,y:52,w:222,h:262,label:'编排与抽取'},
    {x:512,y:52,w:222,h:262,label:'应然资产 → 生成'},
    {x:762,y:52,w:242,h:262,label:'验收'},
    {x:12,y:322,w:992,h:112,label:'支撑层(服务全链)'},
  ],
  nodes:[
    {id:'code',  x:38,  y:92, kind:'external', title:'业务代码', sub:'只读 · 不回写'},

    {id:'graph', x:38,  y:256, kind:'tool', title:'语义透镜', sub:'adapters/_graph.py'},
    {id:'apply', x:288, y:92, kind:'orch', title:'apply 跨环编排', sub:'apply/reference.md'},
    {id:'flow',  x:288, y:174, kind:'orch', title:'执行层 workflow', sub:'plan · verify · finish'},

    {id:'rings', x:538, y:92, kind:'asset', title:'三环资产引擎', sub:'rings/*/reference.md'},

    {id:'gates', x:788, y:92, kind:'gate', title:'门禁与校验', sub:'scripts/atlas_check.py'},
    {id:'review',x:788, y:174, kind:'proc', title:'评审与收口', sub:'closeout_derive.py'},
    {id:'shared',x:38,  y:362, kind:'asset', title:'共享契约层', sub:'shared/ 契约 ×9'},
    {id:'kernel',x:288, y:362, kind:'support', title:'共享内核', sub:'_support/ 内核 ×31'},
    {id:'cli',   x:538, y:362, kind:'support', title:'CLI 与装配', sub:'install.py · atlas.js'},
    {id:'ops',   x:788, y:362, kind:'proc', title:'运营面', sub:'duty-review/ · report'},
  ],
  edges:[
    {from:'req',to:'apply',label:'需求进入',tip:'需求从落点/任务卡进入 apply,先过三问门(改既有能力?要人确认 UI?要可重复验收?)决定拉起哪些环'},
    {from:'apply',to:'rings',label:'增量落笔',tip:'apply 把需求增量写进应然资产——PRD 六件套与 AC→E2E 分片;应然先行,先动资产后写代码;只动受影响集合,从不整文件覆盖'},
    {from:'rings',to:'e2egen',label:'分片 → 脚本',tip:'E2E 用例分片(中文 DSL)编译成 Playwright 脚本;动词值域封闭,陌生动词中止生成'},
    {from:'e2egen',to:'gates',label:'受门禁校验',tip:'生成的脚本与资产产物过门禁与校验器,全绿才算通过'},
    {from:'code',to:'adapt',label:'只读抽取',route:'hv',mx:224,tx:320,tip:'适配器从业务代码只读抽取路由/API/模型/测试事实,绝不回写业务代码'},
    {from:'adapt',to:'rings',label:'结构事实',mx:498,ty:132,tip:'抽取的事实渲染进结构事实区,是三环资产与影响面推导的地基'},
    {from:'graph',to:'apply',label:'影响面证据',mx:276,ty:132,sy:263,tip:'语义透镜反向一跳反查,给影响面推导供候选证据(advisory 基准,不是门)'},
    {from:'adapt',to:'graph',route:'vUp',tip:'结构事实区的两级语义行(cognition.fras)喂给语义透镜做反向一跳'},
    {from:'gates',to:'review',label:'全绿才收口',tip:'全部机器门绿了才允许进入评审与收口'},
    {from:'apply',to:'flow',route:'v',label:'写卡派工',tip:'apply 的产出经 plan 写进执行层任务卡,再由 dispatch 派工执行'},
    {from:'flow',to:'review',route:'hv',sy:232,mx:730,tx:857,label:'回写',tip:'finish 收口回写任务卡与登记,并触发收口对账'},
    {from:'flow',to:'e2egen',tip:'执行层接卡实现后按用例跑验收:Playwright 真跑与控制台慢动作回放都在这一面(回放供人审)'},
    {from:'flow',to:'gates',route:'hv',sy:245,mx:744,tx:857,tip:'verify 与 finish 触发全链门禁(atlas_check,含 E2E 真跑门),门红 ⇒ 收口阻断'},
    {from:'kernel',to:'adapt',route:'hvb',mx:373,dash:1},
  ],
},
apply: {
  title:'apply 跨环编排 · 内部结构', vb:[0,23,1000,393],
  zones:[
    {x:18,y:60,w:210,h:320,label:'上游输入'},
    {x:248,y:60,w:240,h:320,label:'四模式'},
    {x:510,y:60,w:230,h:320,label:'判定与推导'},
    {x:762,y:60,w:220,h:320,label:'落笔与留痕'},
  ],
  nodes:[

/* ================= 渲染引擎 ================= */
const NW=170, NH=54;
const svgNS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
let mode='map';           // 'map' | 'detail'
let currentMap='overview';// 当前显示的拓扑
let currentDetail=null;   // 详情节点 id

function nbox(v,id){const n=v.nodes.find(n=>n.id===id);return {x:n.x,y:n.y,w:NW,h:NH};}
function labelPos(e,a){
  if(e.route==='v')return [a.x+a.w/2+6, a.y+a.h+15];
  return [a.x+a.w+8, a.y+a.h/2-7];
}
function wrap(t){
  if(t.length<=8)return [t];
  const sp=t.lastIndexOf(' ',9);
  if(sp>3)return [t.slice(0,sp),t.slice(sp+1)];
  const cut=Math.ceil(t.length/2);
  return [t.slice(0,cut),t.slice(cut)];
}
function edgePath(v,e){
  const a=nbox(v,e.from), b=nbox(v,e.to);
  if(e.route==='v'){const ax=a.x+a.w/2, ay=a.y+a.h, bx=b.x+b.w/2, by=b.y;
    const my=(ay+by)/2; return `M${ax},${ay} V${my} H${bx} V${by}`;}
  if(e.route==='vUp'){const ax=a.x+a.w/2, bx=b.x+b.w/2; const my=(a.y+b.y+b.h)/2;
    return `M${ax},${a.y} V${my} H${bx} V${b.y+b.h}`;}
  if(e.route==='leftU'){const ay=a.y+a.h/2, by=b.y+b.h/2;
    return `M${a.x},${ay} H${a.x-14} V${by} H${b.x}`;}
  if(e.route==='ring'){const ay=a.y+a.h/2, by=b.y+b.h/2;
    const ry=Math.max(...v.zones.map(z=>z.y+z.h))+18;
    /* rx=回边右转道(缺省贴目标右侧),ty=入目标右缘的锚高(缺省中线)——拆与邻边的共道/共锚 */
    return `M${a.x},${ay} H${a.x-14} V${ry} H${e.rx||b.x+b.w+14} V${e.ty||by} H${b.x+b.w}`;}
/**
 * 合线高维两种路由:hvb = 源右缘出、目标底缘入(竖直上行);
 * sy = 源右缘出口锚高(共源边拆锚用);缺省中线。—— 拆共道/共锚/共口
 */
  if(e.route==='hvb'){const ay=(e.sy!=null?e.sy:a.y+a.h/2);
    return `M${a.x+a.w},${ay} H${e.mx} V${b.y+b.h}`;}
  const ay=(e.sy!=null?e.sy:a.y+a.h/2), by=b.y+b.h/2;
  if(e.route==='hv'){const ax=a.x+a.w, mx=e.mx||Math.max(ax+16,(a.x+a.w+b.x+b.w)/2);
    return `M${ax},${ay} H${mx} V${b.y-12} H${e.tx||b.x+b.w/2} V${b.y}`;}
  const ax=a.x+a.w, bx=b.x;
  if(bx>ax+18){const mx=e.mx||(ax+bx)/2;return `M${ax},${ay} H${mx} V${e.ty||by} H${bx}`;}
  const ax2=a.x, bx2=b.x+b.w, mx2=(ax2+bx2)/2;
  return `M${ax2},${ay} H${mx2} V${by} H${bx2}`;
}
function el(tag,attrs,parent){const e=document.createElementNS(svgNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}

/* 渲染一张拓扑图到容器;interactive=true 时点击节点进详情,false 时点击=钉住摘要 */
function renderMap(container, viewId, interactive){
  const v=VIEWS[viewId];
  const svg=el('svg',{viewBox:`${v.vb[0]} ${v.vb[1]} ${v.vb[2]} ${v.vb[3]}`,role:'img','aria-label':v.title});
  container.appendChild(svg);

    markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);

  const gZ=el('g',{class:'zone'},svg), gE=el('g',{},svg), gN=el('g',{},svg);
  v.zones.forEach(z=>{const g=el('g',{class:'zone'},gZ);
    el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:10},g);
    el('text',{x:z.x+10,y:v.zoneLabIn?z.y+20:z.y-9},g).textContent=z.label;});
  v.edges.forEach(e=>{
    const d=edgePath(v,e);
    el('path',{class:'edge'+(e.dash?' dash':''),d:d,'marker-end':`url(#${mkId})`,'data-e':JSON.stringify([e.from,e.to])},gE);
    if(e.tip){ /* 边动作说明:宽透明命中带,悬浮看「这步做什么」 */
      const hit=el('path',{d:d,class:'edgehit'},gE);

  const gL=el('g',{},gE);
  v.edges.forEach(e=>{
    if(!e.label)return;
    const a=nbox(v,e.from), b2=nbox(v,e.to);
    const tw=e.label.length*12+12;
    let lx,ly;
    if(e.route==='v'){ lx=a.x+a.w/2+4; ly=a.y+a.h+12; }
    else if(!e.route && Math.abs(b2.x-a.x)<20){ const mx2=(a.x+b2.x+b2.w)/2, my=(a.y+b2.y+NH)/2; lx=mx2-tw/2; ly=my+2; }
    else { lx=a.x+a.w+4; ly=a.y+a.h/2-9; if(lx+tw>v.vb[0]+v.vb[2]-4) lx=a.x-tw-6; }
    const chip=el('g',{class:'edgechip'+(e.tip?' hastip':'')},gL);
    el('rect',{x:lx,y:ly-11,width:tw,height:17,rx:5,fill:'var(--card)',stroke:'var(--zone)','stroke-width':1},chip);
    const t=el('text',{class:'edgeLabel',x:lx+6,y:ly+1},chip);t.textContent=e.label;
    if(e.tip){
      chip.addEventListener('mouseenter',ev=>showEdgeTip(v,e,ev));
      chip.addEventListener('mousemove',moveTip);
      chip.addEventListener('mouseleave',hideTip);
    }
  });
  const pinned=interactive?null:(()=>{const d=document.createElement('div');
    d.className='pinned';container.prepend(d);return d;})();
  v.nodes.forEach(n=>{
    const k=KIND[n.kind];
    const g=el('g',{class:'node'+(k.external?' external':''),transform:`translate(${n.x},${n.y})`,'data-id':n.id},gN);
    g.style.setProperty('--nc',`var(${k.c})`);
    el('rect',{class:'box',x:0,y:0,width:NW,height:NH,rx:10},g);
    const t=el('text',{class:'t',x:NW/2,y:23,'text-anchor':'middle'},g);t.textContent=n.title;
    if(n.sub){const st=el('text',{class:'s',x:NW/2,y:41,'text-anchor':'middle'},g);st.textContent=n.sub;}
    g.addEventListener('mouseenter',ev=>showTip(n,k,ev));
    g.addEventListener('mousemove',ev=>moveTip(ev));
    g.addEventListener('mouseleave',hideTip);
    g.addEventListener('click',ev=>{ev.stopPropagation();
      if(interactive){openDetail(n.id);return;}
      // 子图内节点:钉住摘要
      if(pinned){pinned.style.display='block';
        pinned.innerHTML=`<h5>${n.title} <span class="badge" style="--nc:var(${k.c});font-size:10px;border:1px solid var(--nc);color:var(--nc);padding:0 6px;border-radius:99px">${k.label}</span></h5><p>${n.tip.sum}</p>`;
        pinned.scrollIntoView({block:'nearest',behavior:'smooth'});}
    });
  });
  if(pinned)svg.addEventListener('click',()=>{pinned.style.display='none';});
}

const tip=$('#tip');
/* 关键文件行:文件链 vscode://file(仓根绝对路径,含 :行号跳行)——浏览器裸文本难受,编辑器有高亮;
   目录链 file:// 列表;<ID> 模板占位保持纯文本;§N 只剥出目标,显示文本保留原样。
   绝对路径以本页 file:// 位置上两级为仓根,非 file:// 环境退回仓根相对路径 */
function fileEntry(f){
  const p=Array.isArray(f)?f[0]:f,d=Array.isArray(f)?f[1]:'';
  if(p.includes('<'))return `<div class="frow"><code>${esc(p)}</code>${d?`<span class="fdesc">${d}</span>`:''}</div>`;
  const m=p.match(/:(\d+)$/);
  const t=p.replace(/ *§.*$/,'').replace(/:\d+$/,'');
  const dir=/(^|\/)$/.test(t);
  let href;
  if(dir)href='../../'+t;
  else if(location.protocol==='file:')href='vscode://file'+location.href.split('/docs/map/')[0].replace(/^file:\/\//,'').replace(/\/$/,'')+'/'+t;
  else href='../../'+t;
  if(m&&!dir)href+=':'+m[1];
  return `<div class="frow"><a href="${esc(href)}" target="_blank" rel="noopener"><code>${esc(p)}</code></a>${d?`<span class="fdesc">${d}</span>`:''}</div>`;
}
function showTip(n,k,ev){
  const t=n.tip||{sum:DETAIL[n.id]?DETAIL[n.id].sum:'',files:DETAIL[n.id]?DETAIL[n.id].files:[]};
  let h=`<h4>${n.title}<span class="badge" style="--nc:var(${k.c})">${k.label}</span></h4>`;
  h+=`<p>${t.sum}</p>`;
  if(t.files&&t.files.length)h+=`<div class="files">${t.files.map(fileEntry).join('')}</div>`;
  tip.innerHTML=h;tip.style.display='block';moveTip(ev);
}
function moveTip(ev){const r=tip.getBoundingClientRect();
  let x=ev.clientX+16,y=ev.clientY+14;
  if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;
  if(y+r.height>innerHeight-8)y=ev.clientY-r.height-12;
  tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
/* 边动作说明:from → to + 这一步做什么(数据 = VIEWS 各边的 tip 字段) */
function showEdgeTip(v,e,ev){
  const ft=v.nodes.find(n=>n.id===e.from),tt=v.nodes.find(n=>n.id===e.to);
  tip.innerHTML=`<h4>${esc(ft.title)} → ${esc(tt.title)}<span class="badge" style="--nc:var(--primary)">${esc(e.label||'边')}</span></h4><p>${esc(e.tip)}</p>`;
  tip.style.display='block';moveTip(ev);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  li.appendChild(dot);li.appendChild(document.createTextNode(KIND[k].label));lg.appendChild(li);}

/* fit:按窗口内容比例动态选布局宽高比(1040~1160 / 488),再取 contain 尺寸 */
function fitSvg(){
  if(mode!=='map')return;
  const cv=document.getElementById('canvas');
  const vw=document.documentElement.clientWidth||innerWidth;
  const availW=Math.min(vw*0.96,1680)-60;
  const top=Math.min(Math.max(cv.getBoundingClientRect().top,40),220);
  const availH=Math.max(280,innerHeight-top-70);
  const svg=document.querySelector('#canvas>svg'); if(!svg)return;
  const vb=VIEWS[currentMap].vb, r=vb[2]/vb[3];
  let h=availH,w=h*r;
  if(w>availW){w=availW;h=w/r;}
  svg.style.width=Math.round(w)+'px';svg.style.height=Math.round(h)+'px';
  cv.style.width=(Math.round(w)+16)+'px';
  const real=cv.parentElement.clientWidth-36;
  const intended=parseFloat(cv.style.width)||0;
  if(intended>real){
    const f=real/intended;
    svg.style.width=Math.round(w*f)+'px';svg.style.height=Math.round(h*f)+'px';
    cv.style.width=(Math.round(w*f)+16)+'px';
  }
}

let tourOn=false, tourIdx=0, tourTimer=null;
function applyTourStep(){
  if(!tourOn||mode!=='map')return;
  const st=TOUR[tourIdx], focus=new Set(st.focus);
  document.querySelectorAll('#canvas>svg .node').forEach(g=>g.classList.toggle('dim',!focus.has(g.dataset.id)));
  const hiPaths=[];
  document.querySelectorAll('#canvas>svg .edge').forEach(p=>{
    let e=null; try{e=JSON.parse(p.dataset.e);}catch(_){}
    const hi=e&&st.edges.some(x=>x[0]===e[0]&&x[1]===e[1]);
    p.classList.toggle('hi',hi); p.classList.toggle('dim',!hi);
    if(hi)hiPaths.push(p);
  });
  startComet(hiPaths);   /* 彗星沿高亮边从 from 流向 to:步进的方向是这一步的信息 */
  document.getElementById('tstep').textContent=(tourIdx+1)+' / '+TOUR.length;

/* ================= 讲述彗星(借 archify Live 的 overlay 原则:原线样式不动,动效骑在面上) ================= */
let cometRAF=null,cometLayer=null;
function stopComet(){
  if(cometRAF){cancelAnimationFrame(cometRAF);cometRAF=null;}
  if(cometLayer){cometLayer.remove();cometLayer=null;}
}
function startComet(paths){
  stopComet();
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(_){}
  if(!paths||!paths.length)return;
  const svg=paths[0].ownerSVGElement;if(!svg)return;
  cometLayer=document.createElementNS(svgNS,'g');
  cometLayer.setAttribute('pointer-events','none');
  svg.appendChild(cometLayer);
  const riders=paths.map((p,i)=>{
    const mk=r=>el('circle',{r:r,fill:'var(--primary)'},cometLayer);
    return {path:p,len:p.getTotalLength(),head:mk(3.2),echo:mk(1.8),off:i*0.35};
  });
  const fade=u=>u<0.06?u/0.06:(u>0.94?(1-u)/0.06:1);
  const t0=performance.now();
  const tick=now=>{
    const t=(now-t0)/1000;
    riders.forEach(r=>{
      const u=((t/1.4)+r.off)%1;
      const pt=r.path.getPointAtLength(u*r.len);
      r.head.setAttribute('cx',pt.x);r.head.setAttribute('cy',pt.y);
      r.head.setAttribute('opacity',fade(u).toFixed(2));
      const ue=((u-0.045)+1)%1, pe=r.path.getPointAtLength(ue*r.len);
      r.echo.setAttribute('cx',pe.x);r.echo.setAttribute('cy',pe.y);
      r.echo.setAttribute('opacity',(fade(u)*0.4).toFixed(2));
    });
    cometRAF=requestAnimationFrame(tick);
  };
  cometRAF=requestAnimationFrame(tick);
}

/* ================= 节点搜索(借 archify Node Finder;索引从 KIND/VIEWS/DETAIL 运行时现算,不复制数据) ================= */
const finder=$('#finder'),fInput=$('#finput'),fList=$('#flist');
let finderOpen=false,helpOpen=false,fItems=[],fActive=0;
const FIDX=(()=>{
  const out=[];
  for(const vid in VIEWS){
    const isOv=vid==='overview';
    const host=isOv?null:(Object.keys(DETAIL).find(k=>DETAIL[k].sub===vid)||null);
    for(const n of VIEWS[vid].nodes){
      const hid=isOv?n.id:host;
      const ht=isOv?'全景 · 详情':((VIEWS.overview.nodes.find(x=>x.id===hid)||{}).title||vid);
      out.push({id:n.id,title:n.title,sub:n.sub||'',kind:n.kind,host:hid,where:ht,
        text:(n.title+' '+(n.sub||'')+' '+(n.tip?(' '+n.tip.sum):'')+' '+(DETAIL[n.id]?DETAIL[n.id].sum:'')).toLowerCase()});
    }
  }
  return out;
})();
function openFinder(){
  finderOpen=true;finder.classList.add('open');
  fInput.value='';filterFinder('');
  setTimeout(()=>fInput.focus(),0);
}
function closeFinder(){finderOpen=false;finder.classList.remove('open');fInput.blur();}
function toggleFinder(){finderOpen?closeFinder():openFinder();}
function openHelp(){helpOpen=true;$('#helpbox').classList.add('open');}
function closeHelp(){helpOpen=false;$('#helpbox').classList.remove('open');}
function toggleHelp(){helpOpen?closeHelp():openHelp();}
function filterFinder(q){
  const toks=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length){fItems=FIDX.slice(0,20);}
  else{
    const t0=toks[0];
    fItems=FIDX.filter(it=>toks.every(t=>it.text.includes(t)))
      .sort((a,b)=>((b.title.toLowerCase().includes(t0))?1:0)-((a.title.toLowerCase().includes(t0))?1:0))
      .slice(0,20);
  }
  fActive=0;renderFinder();
}
function renderFinder(){
  if(!fItems.length){fList.innerHTML='<div class="empty">没有匹配的节点</div>';return;}
  fList.innerHTML=fItems.map((it,i)=>{
    const k=KIND[it.kind];
    return '<div class="item'+(i===fActive?' active':'')+'" data-i="'+i+'">'
      +'<span class="dot" style="background:var('+k.c+')"></span>'
      +'<span>'+esc(it.title)+(it.sub?'<em>'+esc(it.sub)+'</em>':'')+'</span>'
      +'<span class="where">'+esc(it.where)+'</span></div>';
  }).join('');
  const act=fList.querySelector('.item.active');
  if(act)act.scrollIntoView({block:'nearest'});
}
function jumpTo(it){
  closeFinder();
  if(!DETAIL[it.host])return;
  openDetail(it.host);
  if(it.host!==it.id)requestAnimationFrame(()=>pulseSubNode(it.id));
}
function pulseSubNode(id,tries){
  const g=document.querySelector('.submap .node[data-id="'+id+'"]');
  if(!g){ /* hashchange 异步重建画布,rAF 级重试等它就位(约半秒封顶) */
    if((tries||0)<30)requestAnimationFrame(()=>pulseSubNode(id,(tries||0)+1));
    return; }
  g.classList.add('pulse');
  g.scrollIntoView({block:'nearest',behavior:'smooth'});
  setTimeout(()=>g.classList.remove('pulse'),3600);
}
fInput.addEventListener('input',()=>filterFinder(fInput.value));
fList.addEventListener('click',ev=>{const d=ev.target.closest('.item');if(d)jumpTo(fItems[+d.dataset.i]);});
document.getElementById('finderBtn').onclick=toggleFinder;
document.getElementById('helpBtn').onclick=toggleHelp;
finder.addEventListener('click',ev=>{if(ev.target===finder)closeFinder();});
document.getElementById('helpbox').addEventListener('click',ev=>{if(ev.target.id==='helpbox')closeHelp();});

/* ================= 深链与历史:#d=<节点> / #tour / #tour=<n>(借 archify Passport 可分享链接) ================= */
function applyHash(){
  const h=location.hash||'';let m;
  if((m=h.match(/^#d=([\w-]+)$/))){
    if(tourOn)endTour();
    if(DETAIL[m[1]])showDetail(m[1]);else goOverview();
    return;
  }
  if((m=h.match(/^#tour(?:=(\d+))?$/))){
    if(!tourOn)startTour();
    if(m[1]!=null){tourIdx=Math.max(0,Math.min(TOUR.length-1,+m[1]-1));applyTourStep();}
    return;
  }
  if(tourOn){endTour();return;}   /* endTour 自己清 tour hash,不再触发渲染 */
  if(mode!=='map')showMap();
}

/* ================= 全局快捷键(优先级:面板 → 小抄 → 讲述 → 详情返回) ================= */
window.addEventListener('keydown',ev=>{
  if((ev.metaKey||ev.ctrlKey)&&(ev.key==='k'||ev.key==='K')){ev.preventDefault();toggleFinder();return;}
  if(ev.key==='Escape'){
    if(finderOpen){ev.preventDefault();closeFinder();return;}
    if(helpOpen){ev.preventDefault();closeHelp();return;}
    if(tourOn){endTour();return;}
    if(mode==='detail'){goOverview();return;}
    return;
  }
  if(finderOpen){
    if(ev.key==='ArrowDown'){ev.preventDefault();fActive=Math.min(fItems.length-1,fActive+1);renderFinder();}
    else if(ev.key==='ArrowUp'){ev.preventDefault();fActive=Math.max(0,fActive-1);renderFinder();}
    else if(ev.key==='Enter'){ev.preventDefault();if(fItems[fActive])jumpTo(fItems[fActive]);}
    return;
  }
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(!/^(INPUT|TEXTAREA)$/.test(tag)&&ev.key==='?'){ev.preventDefault();toggleHelp();return;}
  if(!tourOn)return;
  if(ev.key==='ArrowRight'||ev.key===' '){ev.preventDefault();stepTour(1);}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();stepTour(-1);}
});

/* boot;深链直入:#tour(讲述) / #tour=N(第 N 步起讲) / #d=<节点>(详情页) */
showMap();
applyHash();
window.addEventListener('hashchange',applyHash);
</script>
