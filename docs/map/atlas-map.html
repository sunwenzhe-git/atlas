<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas 实现地图 · 交互全景</title>
<style>
  :root{
    --background:#eef1f6; --foreground:#16181d; --card:#fdfdfe; --card-foreground:#16181d;
    --border:#d8dde6; --muted-foreground:#5f6772; --popover:#fdfdfe; --popover-foreground:#16181d;
    --grid:rgba(22,24,29,.05); --zone:rgba(22,24,29,.42);
    --primary:#4f46e5;
    --blue:#2563eb; --green:#059669; --yellow:#d97706; --red:#e11d48; --orange:#7c3aed; --purple:#7c3aed; --slate:#475569;
    --shadow:0 10px 30px rgba(20,26,40,.10); --card-shadow:0 1px 2px rgba(20,26,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--foreground);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  .page{width:100%;max-width:min(96vw,1680px);margin:0 auto;padding:0 18px;display:flex;flex-direction:column}
  .page+.page{flex:1}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0 9px;
    border-bottom:1px solid var(--border);margin-bottom:12px}
  .brand{font-weight:700;font-size:17px;letter-spacing:.3px;color:var(--foreground);display:flex;align-items:center;gap:12px}
  .brand .logo{width:9px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--blue))}
  .brand .bt{display:flex;flex-direction:column}
  .brand small{font-weight:400;font-size:10.5px;color:var(--muted-foreground);letter-spacing:0;margin-top:1px}
  .actions{display:flex;gap:8px;margin-left:auto}
  .actions button{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);
    border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:var(--card-shadow)}
  .actions button:not(:disabled):hover{color:var(--primary);border-color:var(--primary)}
  .actions button:disabled{cursor:default;opacity:.6}
  .actions button.primarylike{background:var(--primary);border-color:var(--primary);color:var(--card)}
  .crumb{display:flex;align-items:center;gap:8px;padding:0 0 7px;font-size:13px;color:var(--muted-foreground)}
  .crumb a{color:var(--muted-foreground);cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--primary);text-decoration:underline}
  .crumb .cur{color:var(--foreground);font-weight:600}
  #canvas{border:1px solid var(--border);border-radius:16px;background-color:var(--card);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;background-position:center;overflow:hidden;box-shadow:var(--shadow)}
  #canvas.svgmode{padding:8px;width:fit-content;max-width:100%;margin:0 auto}
  #canvas.detailmode{padding:30px 34px;width:100%}
  #canvas svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 2px 0;font-size:12px;color:var(--muted-foreground);align-items:center}
  .legend .li{display:inline-flex;align-items:center;gap:5px}
  .legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  footer{padding:5px 2px 10px;font-size:11.5px;color:var(--muted-foreground);display:flex;gap:14px;flex-wrap:wrap}
  /* ---- SVG 图内元素 ---- */
  .zone rect{fill:color-mix(in srgb,var(--blue) 4%,transparent);stroke:var(--zone);stroke-dasharray:6 4;stroke-width:1.3;rx:12}
  .zone text{fill:var(--muted-foreground);font-size:11.5px;font-weight:600;letter-spacing:1.5px}
  .edge{fill:none;stroke:var(--muted-foreground);stroke-width:1.7;opacity:.8}
  .edge.dash{stroke-dasharray:4 5;stroke-width:1.2;opacity:.45}
  .edgeLabel{fill:var(--muted-foreground);font-size:12px;font-weight:500;
    paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
  .node{cursor:pointer}
  .node rect.box{fill:var(--card);stroke:var(--nc);stroke-width:1.4;rx:11;
    filter:drop-shadow(0 1px 2px rgba(10,14,20,.06));transition:filter .16s,stroke-width .16s}
  .node:hover rect.box{stroke-width:2.1;filter:drop-shadow(0 7px 18px rgba(10,14,20,.15))}
  .node.external rect.box{stroke:var(--muted-foreground);stroke-dasharray:5 4;fill:var(--card)}
  .node text.t{fill:var(--card-foreground);font-size:12px;font-weight:600}
  .node text.s{fill:var(--muted-foreground);font-size:10px}
  /* ---- 详情页 ---- */
  .detail{max-width:860px;margin:0 auto}
  .detail h2{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detail .badge{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;
    border:1px solid var(--nc);color:var(--nc);white-space:nowrap;background:color-mix(in srgb,var(--nc) 7%,transparent)}
  .detail .sum{color:var(--foreground);font-size:14.5px;line-height:1.65;margin:8px 0 0}
  .detail h3{margin:24px 0 8px;font-size:12px;color:var(--muted-foreground);font-weight:600;
    letter-spacing:1.5px;border-bottom:1px solid var(--border);padding-bottom:7px}
  .detail ul.points{margin:0;padding:0;list-style:none}
  .detail ul.points li{position:relative;padding:5px 0 5px 22px;font-size:14px;line-height:1.6}
  .detail ul.points li::before{content:'';position:absolute;left:3px;top:13px;width:8px;height:8px;
    border-radius:2.5px;background:var(--nc);opacity:.85}
  .detail .files{display:flex;flex-direction:column;gap:2px;margin:0}
  .frow{display:flex;flex-direction:column;gap:1px;padding:5px 0}
  .frow code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;color:var(--primary);word-break:break-all}
  .frow a{color:inherit;text-decoration:none}
  .frow a:hover code,.frow a:focus code{text-decoration:underline}
  .frow .fdesc{font-size:12.5px;color:var(--muted-foreground);line-height:1.45}
  .detail .blind{background:color-mix(in srgb,var(--nc) 7%,transparent);border:1px dashed var(--nc);
    border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6;color:var(--foreground)}
  .detail .doclink{display:inline-block;margin-top:2px;font-family:ui-monospace,Menlo,monospace;
    font-size:12.5px;color:var(--primary);text-decoration:none;cursor:pointer}
  .detail .doclink:hover{text-decoration:underline}
  .detail .submap{margin-top:6px}
  .detail .pinned{margin:0 0 10px;border:1px solid var(--border);border-radius:10px;background:var(--popover);
    padding:10px 14px;font-size:13px;line-height:1.55;display:none;box-shadow:var(--card-shadow)}
  .detail .pinned h5{margin:0 0 3px;font-size:13.5px}
  .detail .pinned p{margin:2px 0}
  /* ---- tooltip ---- */
  #tip{position:fixed;z-index:50;max-width:340px;background:var(--popover);color:var(--popover-foreground);
    border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(10,14,20,.18);
    padding:13px 15px;font-size:13px;line-height:1.55;pointer-events:none;display:none}
  #tip h4{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}
  #tip .badge{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:99px;
    border:1px solid var(--nc);color:var(--nc);white-space:nowrap;background:color-mix(in srgb,var(--nc) 8%,transparent)}
  #tip p{margin:6px 0 8px}
  #tip .files{display:flex;flex-direction:column;gap:2px;margin:0 0 6px}
  #tip .files code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--primary);word-break:break-all}
  #tip .frow{padding:1px 0}
  #tip .frow .fdesc{font-size:11px}
  /* ---- 讲述模式:非焦点降透明,焦点边加粗;底部字幕条 ---- */
  #canvas>svg .node.dim{opacity:.18;pointer-events:none}
  #canvas>svg .edge.dim{opacity:.1}
  #canvas>svg .edge.hi{stroke-width:2.6}
  #tourbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:none;
    background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(10,14,20,.16);
    padding:10px 12px 10px 16px;width:min(92vw,760px);align-items:center;gap:14px}
  #tourbar .step{font-size:11px;color:var(--muted-foreground);white-space:nowrap;font-weight:700}
  #tourbar .tt{font-size:13.5px;line-height:1.5;flex:1}
  #tourbar .tbtns{display:flex;gap:6px;border-left:1px solid var(--border);padding-left:12px}
  #tourbar button{font:inherit;font-size:13px;line-height:1;padding:6px 9px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border);background:var(--card);color:var(--foreground)}
  #tourbar button:hover{border-color:var(--primary);color:var(--primary)}
</style>
</head>

<div class="page"><header>
  <div class="brand"><span class="logo"></span><span class="bt">Atlas 实现地图<small>锚定 v0.2.0-beta.25 · 图是导航面,细节以 docs/map/ 与代码为准</small></span></div>
  <div class="actions">

</div>

/* ================= 渲染引擎 ================= */
const NW=170, NH=54;
const svgNS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
let mode='map';           // 'map' | 'detail'
let currentMap='overview';// 当前显示的拓扑
let currentDetail=null;   // 详情节点 id

function nbox(v,id){const n=v.nodes.find(n=>n.id===id);return {x:n.x,y:n.y,w:NW,h:NH};}
function labelPos(e,a){
  if(e.route==='v')return [a.x+a.w/2+6, a.y+a.h+15];
  return [a.x+a.w+8, a.y+a.h/2-7];
}
function wrap(t){
  if(t.length<=8)return [t];
  const sp=t.lastIndexOf(' ',9);
  if(sp>3)return [t.slice(0,sp),t.slice(sp+1)];
  const cut=Math.ceil(t.length/2);
  return [t.slice(0,cut),t.slice(cut)];
}
function edgePath(v,e){
  const a=nbox(v,e.from), b=nbox(v,e.to);
  if(e.route==='v'){const ax=a.x+a.w/2, ay=a.y+a.h, bx=b.x+b.w/2, by=b.y;
    const my=(ay+by)/2; return `M${ax},${ay} V${my} H${bx} V${by}`;}
  if(e.route==='vUp'){const ax=a.x+a.w/2, bx=b.x+b.w/2; const my=(a.y+b.y+b.h)/2;
    return `M${ax},${a.y} V${my} H${bx} V${b.y+b.h}`;}
  if(e.route==='leftU'){const ay=a.y+a.h/2, by=b.y+b.h/2;
    return `M${a.x},${ay} H${a.x-14} V${by} H${b.x}`;}
  if(e.route==='ring'){const ay=a.y+a.h/2, by=b.y+b.h/2;
    const ry=Math.max(...v.zones.map(z=>z.y+z.h))+18;
    /* rx=回边右转道(缺省贴目标右侧),ty=入目标右缘的锚高(缺省中线)——拆与邻边的共道/共锚 */
    return `M${a.x},${ay} H${a.x-14} V${ry} H${e.rx||b.x+b.w+14} V${e.ty||by} H${b.x+b.w}`;}
/**
 * 合线高维两种路由:hvb = 源右缘出、目标底缘入(竖直上行);
 * sy = 源右缘出口锚高(共源边拆锚用);缺省中线。—— 拆共道/共锚/共口
 */
  if(e.route==='hvb'){const ay=(e.sy!=null?e.sy:a.y+a.h/2);
    return `M${a.x+a.w},${ay} H${e.mx} V${b.y+b.h}`;}
  const ay=(e.sy!=null?e.sy:a.y+a.h/2), by=b.y+b.h/2;
  if(e.route==='hv'){const ax=a.x+a.w, mx=e.mx||Math.max(ax+16,(a.x+a.w+b.x+b.w)/2);
    return `M${ax},${ay} H${mx} V${b.y-12} H${e.tx||b.x+b.w/2} V${b.y}`;}
  const ax=a.x+a.w, bx=b.x;
  if(bx>ax+18){const mx=e.mx||(ax+bx)/2;return `M${ax},${ay} H${mx} V${e.ty||by} H${bx}`;}
  const ax2=a.x, bx2=b.x+b.w, mx2=(ax2+bx2)/2;
  return `M${ax2},${ay} H${mx2} V${by} H${bx2}`;
}
function el(tag,attrs,parent){const e=document.createElementNS(svgNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}

/* 渲染一张拓扑图到容器;interactive=true 时点击节点进详情,false 时点击=钉住摘要 */
function renderMap(container, viewId, interactive){
  const v=VIEWS[viewId];
  const svg=el('svg',{viewBox:`${v.vb[0]} ${v.vb[1]} ${v.vb[2]} ${v.vb[3]}`,role:'img','aria-label':v.title});
  container.appendChild(svg);
  const defs=el('defs',{},svg);
  const mkId='arr-'+viewId+'-'+(interactive?'i':'s');
  const mk=el('marker',{id:mkId,viewBox:'0 0 10 10',refX:9,refY:5,
    markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--muted-foreground)'},mk);
  const gZ=el('g',{class:'zone'},svg), gE=el('g',{},svg), gN=el('g',{},svg);
  v.zones.forEach(z=>{const g=el('g',{class:'zone'},gZ);
    el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:10},g);
    el('text',{x:z.x+10,y:v.zoneLabIn?z.y+20:z.y-9},g).textContent=z.label;});
  v.edges.forEach(e=>{
    el('path',{class:'edge'+(e.dash?' dash':''),d:edgePath(v,e),'marker-end':`url(#${mkId})`,'data-e':JSON.stringify([e.from,e.to])},gE);
  });
  const gL=el('g',{},gE);
  v.edges.forEach(e=>{
    if(!e.label)return;
    const a=nbox(v,e.from), b2=nbox(v,e.to);
    const tw=e.label.length*12+12;
    let lx,ly;
    if(e.route==='v'){ lx=a.x+a.w/2+4; ly=a.y+a.h+12; }
    else if(!e.route && Math.abs(b2.x-a.x)<20){ const mx2=(a.x+b2.x+b2.w)/2, my=(a.y+b2.y+NH)/2; lx=mx2-tw/2; ly=my+2; }
    else { lx=a.x+a.w+4; ly=a.y+a.h/2-9; if(lx+tw>v.vb[0]+v.vb[2]-4) lx=a.x-tw-6; }
    el('rect',{x:lx,y:ly-11,width:tw,height:17,rx:5,fill:'var(--card)',stroke:'var(--zone)','stroke-width':1},gL);
    const t=el('text',{class:'edgeLabel',x:lx+6,y:ly+1},gL);t.textContent=e.label;
  });
  const pinned=interactive?null:(()=>{const d=document.createElement('div');
    d.className='pinned';container.prepend(d);return d;})();
  v.nodes.forEach(n=>{
    const k=KIND[n.kind];
    const g=el('g',{class:'node'+(k.external?' external':''),transform:`translate(${n.x},${n.y})`,'data-id':n.id},gN);
    g.style.setProperty('--nc',`var(${k.c})`);
    el('rect',{class:'box',x:0,y:0,width:NW,height:NH,rx:10},g);
    const t=el('text',{class:'t',x:NW/2,y:23,'text-anchor':'middle'},g);t.textContent=n.title;
    if(n.sub){const st=el('text',{class:'s',x:NW/2,y:41,'text-anchor':'middle'},g);st.textContent=n.sub;}
    g.addEventListener('mouseenter',ev=>showTip(n,k,ev));
    g.addEventListener('mousemove',ev=>moveTip(ev));
    g.addEventListener('mouseleave',hideTip);
    g.addEventListener('click',ev=>{ev.stopPropagation();
      if(interactive){openDetail(n.id);return;}
      // 子图内节点:钉住摘要
      if(pinned){pinned.style.display='block';
        pinned.innerHTML=`<h5>${n.title} <span class="badge" style="--nc:var(${k.c});font-size:10px;border:1px solid var(--nc);color:var(--nc);padding:0 6px;border-radius:99px">${k.label}</span></h5><p>${n.tip.sum}</p>`;
        pinned.scrollIntoView({block:'nearest',behavior:'smooth'});}
    });
  });
  if(pinned)svg.addEventListener('click',()=>{pinned.style.display='none';});
}

/* 全景模式 */
function showMap(){
  mode='map';currentDetail=null;
  hideTip();
  const cv=$('#canvas');cv.innerHTML='';cv.className='svgmode';
  renderMap(cv,currentMap,true);
  renderCrumb();
  fitSvg();
  if(tourOn)applyTourStep();
}
/* 详情模式 */
function showDetail(id){
  mode='detail';currentDetail=id;
  hideTip();
  const v=VIEWS.overview, node=v.nodes.find(n=>n.id===id), k=KIND[node.kind], d=DETAIL[id];
  const cv=$('#canvas');cv.innerHTML='';cv.className='detailmode';cv.style.width='';
  const div=document.createElement('div');div.className='detail';
  div.style.setProperty('--nc',`var(${k.c})`);
  let h=`<h2>${node.title}<span class="badge">${k.label}</span></h2>`;
  h+=`<p class="sum">${d.sum}</p>`;
  h+=`<h3>核心机制</h3><ul class="points">${d.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(d.files&&d.files.length)h+=`<h3>关键文件</h3><div class="files">${d.files.map(fileEntry).join('')}</div>`;
  if(d.blind)h+=`<h3>显式盲区</h3><div class="blind">${d.blind}</div>`;
  if(d.doc){
    /* 本地(file:)走 vscode://file 通编辑器——与关键文件行同一套仓根推导,浏览器裸 .md 难受;
       站点(http)仍用 cleanUrls 路径 */
    const root=(location.protocol==='file:')?location.href.split('/docs/map/')[0].replace(/^file:\/\//,'').replace(/\/$/,''):'';
    const href=(location.protocol==='file:')?'vscode://file'+root+'/docs/map/'+d.doc:'/atlas/map/'+d.doc.replace(/\.md$/,'');
    h+=`<h3>完整 L1 文档</h3><a class="doclink" href="${href}" target="_blank" rel="noopener">📄 docs/map/${d.doc}</a>`;
  }
  div.innerHTML=h;
  cv.appendChild(div);
  if(d.sub){
    const h3=document.createElement('h3');h3.textContent='内部结构(hover 节点看摘要,点击钉住)';h3.style.cssText='margin:26px 0 4px;font-size:13px;color:var(--muted-foreground);font-weight:500;letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:6px';
    div.appendChild(h3);
    const sub=document.createElement('div');sub.className='submap';
    sub.style.cssText='border:1px solid var(--border);border-radius:12px;padding:14px;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px';
    div.appendChild(sub);
    renderMap(sub,d.sub,false);
  }
  renderCrumb();
  try{window.scrollTo({top:0});}catch(_){}
}
function openDetail(id){showDetail(id);}
function renderCrumb(){
  const c=$('#crumb');c.innerHTML='';
  c.style.display=(mode==='detail')?'flex':'none';
  const a=document.createElement('a');a.textContent='‹ Atlas 全景';a.onclick=showMap;c.appendChild(a);
  if(mode==='detail'){
    const node=VIEWS.overview.nodes.find(n=>n.id===currentDetail);
    const s=document.createElement('span');s.textContent=' / ';c.appendChild(s);
    const cur=document.createElement('span');cur.className='cur';cur.textContent=node.title;c.appendChild(cur);
  }
}
/* tooltip */
const tip=$('#tip');
/* 关键文件行:文件链 vscode://file(仓根绝对路径,含 :行号跳行)——浏览器裸文本难受,编辑器有高亮;
   目录链 file:// 列表;<ID> 模板占位保持纯文本;§N 只剥出目标,显示文本保留原样。
   绝对路径以本页 file:// 位置上两级为仓根,非 file:// 环境退回仓根相对路径 */
function fileEntry(f){
  const p=Array.isArray(f)?f[0]:f,d=Array.isArray(f)?f[1]:'';
  if(p.includes('<'))return `<div class="frow"><code>${esc(p)}</code>${d?`<span class="fdesc">${d}</span>`:''}</div>`;
  const m=p.match(/:(\d+)$/);
  const t=p.replace(/ *§.*$/,'').replace(/:\d+$/,'');
  const dir=/(^|\/)$/.test(t);
  let href;
  if(dir)href='../../'+t;
  else if(location.protocol==='file:')href='vscode://file'+location.href.split('/docs/map/')[0].replace(/^file:\/\//,'').replace(/\/$/,'')+'/'+t;
  else href='../../'+t;
  if(m&&!dir)href+=':'+m[1];
  return `<div class="frow"><a href="${esc(href)}" target="_blank" rel="noopener"><code>${esc(p)}</code></a>${d?`<span class="fdesc">${d}</span>`:''}</div>`;
}
function showTip(n,k,ev){
  const t=n.tip||{sum:DETAIL[n.id]?DETAIL[n.id].sum:'',files:DETAIL[n.id]?DETAIL[n.id].files:[]};
  let h=`<h4>${n.title}<span class="badge" style="--nc:var(${k.c})">${k.label}</span></h4>`;
  h+=`<p>${t.sum}</p>`;
  if(t.files&&t.files.length)h+=`<div class="files">${t.files.map(fileEntry).join('')}</div>`;
  tip.innerHTML=h;tip.style.display='block';moveTip(ev);
}
function moveTip(ev){const r=tip.getBoundingClientRect();
  let x=ev.clientX+16,y=ev.clientY+14;
  if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;
  if(y+r.height>innerHeight-8)y=ev.clientY-r.height-12;
  tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
/* legend */
(function(){const lg=document.getElementById('legend');if(!lg)return;
  for(const k in KIND){const li=document.createElement('span');li.className='li';
  const dot=document.createElement('span');dot.className='dot';dot.style.background='var('+KIND[k].c+')';
  li.appendChild(dot);li.appendChild(document.createTextNode(KIND[k].label));lg.appendChild(li);}
  const v=document.createElement('span');v.className='li';v.style.marginLeft='auto';v.textContent='v0.2.0-beta.25';lg.appendChild(v);})();
/* fit:按窗口内容比例动态选布局宽高比(1040~1160 / 488),再取 contain 尺寸 */
function fitSvg(){
  if(mode!=='map')return;
  const cv=document.getElementById('canvas');
  const vw=document.documentElement.clientWidth||innerWidth;
  const availW=Math.min(vw*0.96,1680)-60;
  const top=Math.min(Math.max(cv.getBoundingClientRect().top,40),220);
  const availH=Math.max(280,innerHeight-top-70);
  const svg=document.querySelector('#canvas>svg'); if(!svg)return;
  const vb=VIEWS[currentMap].vb, r=vb[2]/vb[3];
  let h=availH,w=h*r;
  if(w>availW){w=availW;h=w/r;}
  svg.style.width=Math.round(w)+'px';svg.style.height=Math.round(h)+'px';
  cv.style.width=(Math.round(w)+16)+'px';
  const real=cv.parentElement.clientWidth-36;
  const intended=parseFloat(cv.style.width)||0;
  if(intended>real){
    const f=real/intended;
    svg.style.width=Math.round(w*f)+'px';svg.style.height=Math.round(h*f)+'px';
    cv.style.width=(Math.round(w*f)+16)+'px';
  }
}
let _fitT=null;
window.addEventListener('resize',()=>{clearTimeout(_fitT);_fitT=setTimeout(fitSvg,80);});
window.addEventListener('load',()=>{fitSvg();requestAnimationFrame(fitSvg);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitSvg());
function badge(){
  const svg=document.querySelector('#canvas>svg');if(!svg)return;
  const b=document.getElementById('fitbadge');if(!b)return;
  const r=svg.getBoundingClientRect();
  b.textContent='视口 '+document.documentElement.clientWidth+'×'+innerHeight+' · 图 '+Math.round(r.width)+'×'+Math.round(r.height);
}
const _fitSvgOld=fitSvg;
fitSvg=function(){_fitSvgOld();badge();};
/* ================= 讲述模式(2026-10-25:十步主数据流动线,文案与 index.md「一页看懂」同源) ================= */
const TOUR=[
 {focus:['code','req'],edges:[],text:'Atlas 管两条输入:你已有的业务代码,和你要做的需求'},
 {focus:['code','adapt'],edges:[['code','adapt']],text:'适配器只读抽取路由、API、模型、测试事实——实然先入库'},
 {focus:['adapt','rings'],edges:[['adapt','rings']],text:'结构事实是三环资产的地基,机器渲染、键级对账'},
 {focus:['code','graph','apply'],edges:[['code','graph'],['graph','apply']],text:'代码图谱只当哑索引,给影响面推导供静态调用面证据'},
 {focus:['req','apply'],edges:[['req','apply']],text:'需求过三问门,决定拉起哪些环;apply 只编排不越界'},
 {focus:['apply','rings'],edges:[['apply','rings']],text:'需求落成 PRD 六件套,AC 分解为 E2E 用例分片'},
 {focus:['rings','e2egen'],edges:[['rings','e2egen']],text:'中文分片编译成 Playwright 脚本,动词值域封闭、陌生即中止'},
 {focus:['e2egen','gates'],edges:[['e2egen','gates']],text:'十校验器加八类编排门,全绿是收口的硬前置'},
 {focus:['gates','review'],edges:[['gates','review']],text:'独立审查 N/M 对账,影响面预测也要被 reconcile 审计'},
 {focus:['shared','kernel','cli'],edges:[],text:'契约真相源、单源内核、装配对账——服务全链'},
];
let tourOn=false, tourIdx=0, tourTimer=null;
function applyTourStep(){
  if(!tourOn||mode!=='map')return;
  const st=TOUR[tourIdx], focus=new Set(st.focus);
  document.querySelectorAll('#canvas>svg .node').forEach(g=>g.classList.toggle('dim',!focus.has(g.dataset.id)));
  document.querySelectorAll('#canvas>svg .edge').forEach(p=>{
    let e=null; try{e=JSON.parse(p.dataset.e);}catch(_){}
    const hi=e&&st.edges.some(x=>x[0]===e[0]&&x[1]===e[1]);
    p.classList.toggle('hi',hi); p.classList.toggle('dim',!hi);
  });
  document.getElementById('tstep').textContent=(tourIdx+1)+' / '+TOUR.length;
  document.getElementById('ttext').textContent=st.text;
}
function startTour(){
  tourOn=true;tourIdx=0;
  if(mode!=='map'||currentMap!=='overview'){currentMap='overview';showMap();}
  document.getElementById('tourbar').style.display='flex';
  applyTourStep();
}
function endTour(){
  tourOn=false; stopTourPlay();
  document.querySelectorAll('#canvas>svg .node.dim,#canvas>svg .edge.dim,#canvas>svg .edge.hi')
    .forEach(x=>x.classList.remove('dim','hi'));
  document.getElementById('tourbar').style.display='none';
}
function stepTour(d){tourIdx=Math.max(0,Math.min(TOUR.length-1,tourIdx+d));applyTourStep();}
function stopTourPlay(){if(tourTimer){clearInterval(tourTimer);tourTimer=null;}document.getElementById('tplay').textContent='▶';}
function toggleTourPlay(){
  if(tourTimer){stopTourPlay();return;}
  document.getElementById('tplay').textContent='⏸';
  tourTimer=setInterval(()=>{if(tourIdx>=TOUR.length-1){stopTourPlay();return;}stepTour(1);},5000);
}
document.getElementById('tourBtn').onclick=startTour;
document.getElementById('tprev').onclick=()=>stepTour(-1);
document.getElementById('tnext').onclick=()=>stepTour(1);
document.getElementById('tplay').onclick=toggleTourPlay;
document.getElementById('texit').onclick=endTour;
window.addEventListener('keydown',ev=>{
  if(!tourOn)return;
  if(ev.key==='ArrowRight'||ev.key===' '){ev.preventDefault();stepTour(1);}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();stepTour(-1);}
  else if(ev.key==='Escape'){endTour();}
});
/* boot;#tour 直入讲述模式(讲解场景:打开链接即讲述) */
showMap();
if(location.hash==='#tour')startTour();
</script>
