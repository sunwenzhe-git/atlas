name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX baseline (CLI + wiring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      # 出厂全量门禁仍以本地 `python3 -m pytest tests/` 为准（含 Playwright/真跑面）；
      # CI 这里只跑与平台入口强相关的两组，保证 Windows 有同口径对照基线。
      - name: Run CLI and wiring tests
        run: python -m pytest tests/test_cli_commands.py tests/test_project_wiring.py -q

  windows:
    name: Windows smoke (Git Bash / CLI)
    runs-on: windows-latest
    env:
      # node 输出 UTF-8；Windows 的 Python 默认 cp1252 解码测试子进程输出会崩/乱码
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      # python.org 的 Windows Python 只提供 python.exe；install.sh 薄 wrapper 用
      # `python3`，配一个别名让 Git Bash 轨的测试可解析。Windows 原生轨走
      # install.py（不经过 wrapper），不需要这个别名。
      - name: Provide python3 alias (Git Bash wrapper)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "py3"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Get-Command python).Source (Join-Path $dir "python3.exe")
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Platform probes (Git Bash found, Trellis probe does not throw)
        run: |
          node -e "
            const p = require('./bin/platform.js');
            const bash = p.resolveBash();
            if (!bash) { console.error('Git Bash not found'); process.exit(1); }
            console.log('bash =', bash);
            console.log('trellis =', p.detectTrellis());
          "

      - name: CLI exit-code smoke
        run: |
          node bin/atlas.js version
          node bin/atlas.js --help > /dev/null
          node bin/atlas.js upgrade --dry-run | grep -q "atlas-project-harness@latest"
          # GitHub 的 bash 带 `-eo pipefail`：非零命令会先中断步骤，必须先捕获 rc 再断言
          rc=0; node bin/atlas.js apply > /dev/null 2>&1 || rc=$?; test "$rc" -eq 2
          rc=0; node bin/atlas.js nonexistent-cmd > /dev/null 2>&1 || rc=$?; test "$rc" -eq 2

      - name: Run CLI and wiring tests
        run: python -m pytest tests/test_cli_commands.py tests/test_project_wiring.py -q -k "not update_dry_run_on_initialized"

      - name: Installer via Git Bash (gating)
        run: python -m pytest tests/test_cli_commands.py -q -k "update_dry_run_on_initialized"

  windows-native:
    name: Windows native (PowerShell, no bash)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bare PowerShell init → check → update (dry-run stays zero-write)
        run: |
          $repo = (Get-Location).Path
          $nodeExe = (Get-Command node).Source
          $tmp = Join-Path $env:RUNNER_TEMP ("atlas-native-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp ".trellis") | Out-Null
          Write-Host "::group::init"
          & $nodeExe "$repo\bin\atlas.js" init --target $tmp --assets-root docs
          if ($LASTEXITCODE -ne 0) { throw "init failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $tmp ".atlas\VERSION"))) { throw "VERSION missing" }
          if (-not (Test-Path (Join-Path $tmp ".atlas\MANIFEST.json"))) { throw "MANIFEST missing" }
          Write-Host "::endgroup::"

          # 全新脚手架 = 占位符 stack-profile + 无 PRD ⇒ check --fast 按设计 exit 1
          # （README「占位符替换前 FAIL 属预期」）。这里钉住 fail-closed，而不是假装绿。
          Write-Host "::group::check --fast (expect fail-closed exit 1)"
          Push-Location $tmp
          try {
            $out = & $nodeExe "$repo\bin\atlas.js" check --fast 2>&1 | Out-String
            $rc = $LASTEXITCODE
            Write-Host $out
            if ($rc -ne 1) { throw "expected fail-closed exit 1 on placeholder profile, got $rc" }
            if ($out -notmatch "validate_stack_profile") { throw "check output missing validate_stack_profile" }

            $before = Get-Content (Join-Path $tmp ".atlas\VERSION") -Raw
            & $nodeExe "$repo\bin\atlas.js" update --dry-run
            if ($LASTEXITCODE -ne 0) { throw "update dry-run failed: $LASTEXITCODE" }
            $after = Get-Content (Join-Path $tmp ".atlas\VERSION") -Raw
            if ($before -ne $after) { throw "dry-run modified .atlas/VERSION" }
          } finally {
            Pop-Location
            Write-Host "::endgroup::"
          }

      - name: GBK console encoding does not crash the installer
        run: |
          $repo = (Get-Location).Path
          $tmp = Join-Path $env:RUNNER_TEMP ("atlas-gbk-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp ".trellis") | Out-Null
          $oldEnc = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = [System.Text.Encoding]::GetEncoding(936)
            node "$repo\bin\atlas.js" init --target $tmp --assets-root docs
            if ($LASTEXITCODE -ne 0) { throw "init under cp936 failed: $LASTEXITCODE" }
            if (-not (Test-Path (Join-Path $tmp ".atlas\VERSION"))) { throw "VERSION missing" }
          } finally {
            [Console]::OutputEncoding = $oldEnc
          }

      - name: Python resolver checks (real interpreter + version gate)
        run: |
          $repo = (Get-Location).Path
          $repoForNode = $repo -replace '\\', '/'
          $nodeExe = (Get-Command node).Source
          $code = 'const p = require(process.argv[1] + "/bin/platform.js"); const r = p.resolvePython(); if (!r || r.version.major !== 3 || r.version.minor < 10) { console.error("resolvePython failed on this host:", r); process.exit(1); } if (p.versionSupported(p.parsePythonVersion("Python 3.9.18"))) { console.error("Python 3.9 must be rejected"); process.exit(1); } if (!p.versionSupported(p.parsePythonVersion("Python 3.10.0"))) { console.error("Python 3.10 must be accepted"); process.exit(1); } console.log("resolver ok:", r.cmd, r.version);'
          & $nodeExe -e $code $repoForNode
          if ($LASTEXITCODE -ne 0) { throw "python resolver checks failed" }

