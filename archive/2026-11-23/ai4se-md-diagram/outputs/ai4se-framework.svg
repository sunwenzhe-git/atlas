<svg viewBox="0 0 2000 860" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="2000" height="860" fill="#f7f2e0"/>
  <text x="26" y="84" font-size="58" font-weight="800" fill="#454545">AI4SE 框架</text>

  <!-- 主框 -->
  <rect x="30" y="118" width="1520" height="640" rx="30" fill="#fefef9" stroke="#1a1a1a" stroke-width="4.5"/>

  <!-- 第一行：虚线 -->
  <rect x="62" y="165" width="340" height="112" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="232" y="200" text-anchor="middle" font-size="30" font-weight="700">Task UI Console</text>
  <text x="232" y="236" text-anchor="middle" font-size="27">Add tasks, checkpoints,</text>
  <text x="232" y="268" text-anchor="middle" font-size="27">and view tasks.</text>

  <rect x="428" y="165" width="545" height="112" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="700" y="200" text-anchor="middle" font-size="30" font-weight="700">Task Controller</text>
  <text x="700" y="236" text-anchor="middle" font-size="27">Plan and schedule tasks for 24-hour</text>
  <text x="700" y="268" text-anchor="middle" font-size="27">operation.</text>

  <rect x="1000" y="165" width="508" height="112" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="1254" y="216" text-anchor="middle" font-size="30" font-weight="700">Toolchain Connector</text>
  <text x="1254" y="252" text-anchor="middle" font-size="27">Unified external tool integration.</text>

  <!-- 第二行：实线 -->
  <rect x="62" y="313" width="565" height="118" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="344" y="348" text-anchor="middle" font-size="30" font-weight="700">User Harness</text>
  <text x="344" y="384" text-anchor="middle" font-size="27"><tspan font-weight="700">Docs: </tspan>agent.md/standards/adr/facts</text>
  <text x="344" y="418" text-anchor="middle" font-size="27"><tspan font-weight="700">Self Testing: </tspan>API Testing/E2E Testing</text>

  <rect x="652" y="313" width="355" height="118" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="829" y="364" text-anchor="middle" font-size="30" font-weight="700">SDD Framework</text>
  <text x="829" y="400" text-anchor="middle" font-size="27">BMAD/OpenSpec/Custom</text>

  <rect x="1032" y="313" width="476" height="118" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="1270" y="364" text-anchor="middle" font-size="30" font-weight="700">Skills Suite</text>
  <text x="1270" y="400" text-anchor="middle" font-size="27">ba-*/dev-*/pm-*/qa-*</text>

  <!-- 灰条 -->
  <rect x="62" y="467" width="1462" height="112" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="793" y="533" text-anchor="middle" font-size="30"><tspan font-weight="700">Coding Agent: </tspan>Claude Code/Cursor/Codex</text>

  <rect x="62" y="613" width="1462" height="112" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="793" y="679" text-anchor="middle" font-size="30"><tspan font-weight="700">LLM: </tspan>ChatGPT/DeepSeek/Grok/GLM</text>

  <!-- 箭头 -->
  <line x1="1554" y1="220" x2="1578" y2="220" stroke="#4a90e2" stroke-width="5"/>
  <polygon points="1578,209 1597,220 1578,231" fill="#4a90e2"/>

  <!-- 外部工具盒 -->
  <rect x="1595" y="165" width="385" height="300" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="1672" y="222" width="26" height="26" transform="rotate(45 1685 235)" fill="#2684ff"/>
  <text x="1810" y="252" text-anchor="middle" font-size="50" font-weight="700" fill="#2684ff">Jira</text>
  <text x="1740" y="352" text-anchor="middle" font-size="42" font-weight="700" fill="#16385c">sonarqube</text>
  <path d="M 1858 336 A 20 20 0 0 1 1878 316" fill="none" stroke="#58a6d6" stroke-width="6"/>
  <path d="M 1862 350 A 36 36 0 0 1 1898 314" fill="none" stroke="#2d7cb3" stroke-width="6"/>
  <path d="M 1866 364 A 52 52 0 0 1 1918 312" fill="none" stroke="#1a5f8f" stroke-width="6"/>
  <polygon points="1673,420 1683,444 1703,444 1693,420" fill="#fc6d26"/>
  <text x="1808" y="446" text-anchor="middle" font-size="44" font-weight="600" fill="#5a5a5a">GitLab</text>
</svg>
